name: Aplicar migraciones a Supabase

# Modelo GitHub: cada push a main aplica las migraciones de
# supabase/migrations a la base de producción con `supabase db push`.
# No usa Docker. Requiere los secrets configurados en el repo (ver DEPLOY.md).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migraciones
        run: supabase db push
